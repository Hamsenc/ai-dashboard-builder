<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DWH Explorer — LSR Data Explorer</title>
<meta name="description" content="Khám phá Data Warehouse: Knowledge Map, Data Lineage, Data Catalog cho team Data." />
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="stylesheet" href="/theme.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- Sidebar + top bar dùng chung ---------- */
  .sidebar {
    width: 208px; flex-shrink: 0; background: var(--surface-2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 12px; gap: 2px; overflow-y: auto;
  }
  .sidebar-title { padding: 0 10px 18px; }
  .sidebar-logo { display: block; width: 100%; height: auto; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sidebar-logo { filter: invert(1); } }
  :root[data-theme="dark"] .sidebar-logo { filter: invert(1); }
  .sidebar-link {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink-secondary); text-decoration: none;
  }
  .sidebar-link:hover { background: var(--surface); color: var(--ink-primary); }
  .sidebar-link.active { background: var(--surface); color: var(--series-1); }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  #theme-toggle-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-primary);
    border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px;
  }
  .account-cluster { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-secondary); }
  .account-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--series-1); color: var(--on-primary);
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; flex-shrink: 0;
  }
  .account-cluster a { color: var(--series-1); font-weight: 600; text-decoration: none; }

  /* ---------- Tab navigation ---------- */
  .tab-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 0; padding: 0 24px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .tab-btn {
    position: relative; border: none; background: none; padding: 14px 20px; font-size: 13.5px;
    font-weight: 600; color: var(--ink-muted); cursor: pointer; font-family: inherit;
    transition: color .2s;
  }
  .tab-btn:hover { color: var(--ink-primary); }
  .tab-btn.active { color: var(--series-1); }
  .tab-btn.active::after {
    content: ''; position: absolute; bottom: -1px; left: 12px; right: 12px; height: 2.5px;
    background: var(--series-1); border-radius: 2px 2px 0 0;
  }
  .tab-btn .tab-icon { margin-right: 6px; }

  .tab-panel { flex: 1; min-height: 0; display: none; }
  .tab-panel.active { display: flex; flex-direction: column; }

  /* ============================================================
     KNOWLEDGE MAP
     ============================================================ */
  #km-panel { position: relative; overflow: hidden; }

  .km-controls {
    position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .km-search-box {
    display: flex; align-items: center; gap: 8px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08); backdrop-filter: blur(12px);
    min-width: 260px;
  }
  .km-search-box input {
    border: none; background: none; color: var(--ink-primary); font-size: 13px;
    outline: none; flex: 1; font-family: inherit;
  }
  .km-search-icon { color: var(--ink-muted); font-size: 14px; flex-shrink: 0; }

  .km-filter-chips {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .km-chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
    border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s; box-shadow: 0 2px 8px rgba(0,0,0,.05);
    user-select: none;
  }
  .km-chip:hover { border-color: var(--series-1); color: var(--ink-primary); }
  .km-chip.active { background: var(--series-1); border-color: var(--series-1); color: var(--on-primary); }

  .km-zoom-controls {
    position: absolute; bottom: 20px; right: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 4px;
  }
  .km-zoom-btn {
    width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--ink-primary); font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(0,0,0,.08); transition: all .15s;
  }
  .km-zoom-btn:hover { background: var(--surface-2); transform: scale(1.05); }

  /* Legend */
  .km-legend {
    position: absolute; bottom: 20px; left: 20px; z-index: 10;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
    font-size: 12px;
  }
  .km-legend-title { font-weight: 700; margin-bottom: 10px; color: var(--ink-primary); }
  .km-legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--ink-secondary); }
  .km-legend-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
  }
  .km-legend-line {
    width: 24px; height: 2px; flex-shrink: 0; border-radius: 1px;
  }

  /* SVG canvas */
  #km-svg { width: 100%; height: 100%; cursor: grab; }
  #km-svg:active { cursor: grabbing; }
  #km-svg .node-group { cursor: pointer; }
  #km-svg .node-circle { transition: filter .2s, opacity .2s; }
  #km-svg .node-label {
    font-size: 11px; font-weight: 600; fill: var(--ink-secondary);
    pointer-events: none; text-anchor: middle;
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
  }
  #km-svg .node-label-lg {
    font-size: 10.5px; font-weight: 700; fill: var(--ink-primary);
  }
  #km-svg .edge-line { fill: none; stroke-width: 1.5; }
  #km-svg .edge-line.feeds { stroke-dasharray: 6 3; }
  .km-dimmed .node-circle { opacity: 0.12 !important; }
  .km-dimmed .node-label { opacity: 0.15 !important; }
  .km-dimmed .edge-line { opacity: 0.06 !important; }
  .km-dimmed .km-highlight .node-circle { opacity: 1 !important; }
  .km-dimmed .km-highlight .node-label { opacity: 1 !important; }
  .km-dimmed .km-highlight-edge { opacity: 0.7 !important; }

  /* Animated data flow on edges */
  @keyframes edgeFlow {
    to { stroke-dashoffset: -18; }
  }
  #km-svg .edge-line.feeds { animation: edgeFlow 2s linear infinite; }

  /* Node tooltip */
  .km-tooltip {
    position: absolute; z-index: 20; pointer-events: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.15);
    font-size: 12.5px; max-width: 280px; opacity: 0; transition: opacity .15s;
  }
  .km-tooltip.visible { opacity: 1; }
  .km-tooltip-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .km-tooltip-type {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; margin-bottom: 6px;
  }
  .km-tooltip-row { color: var(--ink-secondary); margin-top: 3px; }

  /* Node detail panel (right sidebar) */
  .km-detail-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 400px; z-index: 15;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: -8px 0 30px rgba(0,0,0,.1); overflow-y: auto;
    transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .km-detail-panel.open { transform: translateX(0); }
  .km-detail-header {
    position: sticky; top: 0; background: var(--surface); padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border); z-index: 1;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .km-detail-close {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
    border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .km-detail-close:hover { background: var(--surface-2); color: var(--ink-primary); }
  .km-detail-title {
    font-size: 16px; font-weight: 700; margin: 0;
    font-family: 'DM Mono', ui-monospace, monospace; word-break: break-all;
  }
  .km-detail-badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 3px 9px; border-radius: 6px; margin-top: 6px;
  }
  .km-detail-body { padding: 18px 20px 28px; }
  .km-detail-section { margin-bottom: 20px; }
  .km-detail-section-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-muted); margin-bottom: 8px;
  }
  .km-detail-value { font-size: 13.5px; line-height: 1.55; }
  .km-detail-meta-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .km-detail-meta-item {
    background: var(--surface-2); border-radius: 10px; padding: 10px 12px;
  }
  .km-detail-meta-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-muted); margin-bottom: 3px;
  }
  .km-detail-meta-value { font-size: 13px; font-weight: 600; }
  .km-detail-list { list-style: none; padding: 0; margin: 0; }
  .km-detail-list li {
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px;
    display: flex; align-items: center; gap: 8px;
  }
  .km-detail-list li:last-child { border-bottom: none; }
  .km-detail-formula {
    background: var(--surface-2); border-radius: 8px; padding: 10px 12px;
    font-family: 'DM Mono', ui-monospace, monospace; font-size: 12px;
    line-height: 1.55; white-space: pre-wrap; word-break: break-word;
  }

  /* Empty/loading states */
  .km-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--ink-muted); font-size: 14px; }

  /* ============================================================
     DATA CATALOG
     ============================================================ */
  #catalog-panel { overflow-y: auto; padding: 0; }
  .catalog-content { max-width: 1100px; margin: 0 auto; padding: 28px 32px; }

  /* Stats row */
  .catalog-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; transition: transform .15s, box-shadow .15s;
  }
  .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .stat-card-value {
    font-size: 28px; font-weight: 700; line-height: 1.2;
    background: linear-gradient(135deg, var(--series-1), var(--good));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card-label { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-top: 4px; }

  /* Search + filters */
  .catalog-search-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .catalog-search-box {
    flex: 1; min-width: 280px; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 16px; transition: border-color .2s, box-shadow .2s;
  }
  .catalog-search-box:focus-within {
    border-color: var(--series-1); box-shadow: 0 0 0 3px var(--series-1-wash);
  }
  .catalog-search-box input {
    border: none; background: none; color: var(--ink-primary); font-size: 14px;
    outline: none; flex: 1; font-family: inherit;
  }
  .catalog-search-icon { color: var(--ink-muted); font-size: 16px; }
  .catalog-filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .catalog-filter-label { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-right: 4px; }
  .catalog-chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
    border-radius: 999px; padding: 5px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s; user-select: none;
  }
  .catalog-chip:hover { border-color: var(--series-1); color: var(--ink-primary); }
  .catalog-chip.active { background: var(--series-1); border-color: var(--series-1); color: var(--on-primary); }

  .catalog-results-info { font-size: 12.5px; color: var(--ink-muted); margin-bottom: 16px; }

  /* Table cards grid */
  .catalog-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }
  .catalog-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 0; cursor: pointer; transition: transform .15s, box-shadow .15s;
    overflow: hidden;
  }
  .catalog-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.1); }
  .catalog-card-accent { height: 4px; border-radius: 14px 14px 0 0; }
  .catalog-card-body { padding: 16px 18px; }
  .catalog-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .catalog-card-name {
    font-size: 14px; font-weight: 700;
    font-family: 'DM Mono', ui-monospace, monospace;
  }
  .catalog-card-dataset-badge {
    flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 3px 8px;
    border-radius: 6px; background: var(--surface-2); color: var(--ink-muted);
    text-transform: uppercase; letter-spacing: .03em;
  }
  .catalog-card-desc {
    font-size: 12.5px; color: var(--ink-secondary); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 10px;
  }
  .catalog-card-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .catalog-card-tag {
    font-size: 11px; color: var(--ink-muted); display: flex; align-items: center; gap: 4px;
  }
  .catalog-card-pii {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: var(--warning-bg); color: var(--warning-ink);
  }
  .catalog-card-view-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: var(--series-1-wash); color: var(--series-1);
  }

  /* Catalog detail view */
  #catalog-detail { display: none; }
  #catalog-detail.active { display: block; }
  #catalog-list.hidden-view { display: none; }

  .catalog-back-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-primary);
    border-radius: 8px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; margin-bottom: 18px;
  }
  .catalog-back-btn:hover { background: var(--surface-2); }

  .catalog-detail-title {
    font-size: 22px; font-weight: 700;
    font-family: 'DM Mono', ui-monospace, monospace; margin: 0 0 4px;
  }
  .catalog-detail-subtitle { font-size: 12.5px; color: var(--ink-muted); margin: 0 0 16px; }

  .catalog-detail-grain {
    display: flex; gap: 10px; align-items: flex-start; background: var(--series-1-wash);
    border: 1px solid var(--series-1); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px;
  }
  .catalog-detail-grain-icon { font-size: 18px; line-height: 1.3; }
  .catalog-detail-grain-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--series-1); margin-bottom: 3px;
  }
  .catalog-detail-grain-value { font-size: 13.5px; font-weight: 600; line-height: 1.45; }

  .catalog-meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; margin-bottom: 22px;
  }
  .catalog-meta-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; transition: transform .15s;
  }
  .catalog-meta-item:hover { transform: translateY(-1px); }
  .catalog-meta-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-muted); margin-bottom: 4px;
  }
  .catalog-meta-value { font-size: 13px; line-height: 1.45; }

  .catalog-section-title { font-size: 14px; font-weight: 700; margin: 24px 0 12px; }

  .catalog-col-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .catalog-col-table th, .catalog-col-table td {
    padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
  }
  .catalog-col-table th {
    background: var(--surface-2); position: sticky; top: 0; font-weight: 650;
    color: var(--ink-secondary); font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em;
  }
  .catalog-col-table td { vertical-align: top; }
  .catalog-col-table tbody tr:hover { background: var(--series-1-wash); }
  .catalog-col-table tbody tr:last-child td { border-bottom: none; }
  .catalog-col-name { font-family: 'DM Mono', ui-monospace, monospace; font-weight: 600; white-space: nowrap; }
  .catalog-col-type { color: var(--ink-muted); font-size: 11.5px; white-space: nowrap; }
  .catalog-col-desc { min-width: 240px; white-space: normal; line-height: 1.5; }

  .catalog-related-table {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; transition: all .15s;
  }
  .catalog-related-table:hover { background: var(--surface-2); transform: translateX(3px); }
  .catalog-related-name { font-weight: 600; font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px; }
  .catalog-related-info { font-size: 11.5px; color: var(--ink-muted); }
  .catalog-related-cols {
    font-size: 11px; color: var(--ink-secondary); margin-top: 4px;
    font-family: 'DM Mono', ui-monospace, monospace;
  }

  .catalog-kpi-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    background: var(--surface-2); border-radius: 999px; padding: 5px 12px; margin: 3px;
  }
  .catalog-kpi-status {
    width: 7px; height: 7px; border-radius: 50%;
  }

  .catalog-pii-banner {
    background: var(--warning-bg); color: var(--warning-ink); border-radius: 10px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
  }

  .sentinel-note-inline {
    display: inline-block; font-size: 11px; color: var(--warning-ink); background: var(--warning-bg);
    border-radius: 6px; padding: 1px 7px; margin-top: 4px;
  }

  .empty-state { color: var(--ink-muted); font-size: 13.5px; }

  .scroll-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }

  /* Cross-navigation & lineage styling */
  .catalog-action-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .catalog-nav-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-primary); border-radius: 8px;
    padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .catalog-nav-btn:hover { background: var(--surface-2); border-color: var(--series-1); color: var(--series-1); }

  .km-to-catalog-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: var(--series-1-wash); border: 1px solid var(--series-1); color: var(--series-1);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; margin-bottom: 16px; transition: all .15s;
  }
  .km-to-catalog-btn:hover { background: var(--series-1); color: var(--on-primary); }

  .source-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
    font-family: 'DM Mono', ui-monospace, monospace; font-weight: 600;
    padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink-primary); margin: 3px 4px 3px 0;
  }
  .source-badge.lake { border-color: rgba(239, 83, 80, 0.4); background: rgba(239, 83, 80, 0.08); color: #EF5350; }
  .source-badge.logic { border-color: rgba(255, 152, 0, 0.4); background: rgba(255, 152, 0, 0.08); color: #FF9800; }
  .source-badge.dim { border-color: rgba(38, 166, 154, 0.4); background: rgba(38, 166, 154, 0.08); color: #26A69A; }
  .source-badge.serving { border-color: rgba(74, 144, 217, 0.4); background: rgba(74, 144, 217, 0.08); color: #4A90D9; }

  .catalog-lineage-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .catalog-lineage-desc { font-size: 13px; line-height: 1.5; color: var(--ink-secondary); margin-bottom: 10px; }
  .catalog-lineage-badges { display: flex; flex-wrap: wrap; gap: 4px; }

  .catalog-sql-wrap {
    position: relative; background: var(--surface-2); border: 1px solid var(--border);

</style>

<script>

/* ========== Theme + Auth (shared pattern) ========== */
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById('theme-toggle-btn').onclick = () => {
    const isDark = document.documentElement.dataset.theme === 'dark'
      || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
  };
})();

let devUser = localStorage.getItem('dev_user') || 'dev@local';
let isAuthenticated = false;

function renderAccount(me) {
  const el = document.getElementById('account-cluster');
  el.innerHTML = '';
  if (!me) {
    const login = document.createElement('a'); login.href = '/auth/lark/login'; login.textContent = 'Đăng nhập Lark';
    el.appendChild(login); return;
  }
  const avatar = document.createElement('div');
  avatar.className = 'account-avatar';
  avatar.textContent = (me.user.trim()[0] || '?').toUpperCase();
  const name = document.createElement('span'); name.textContent = me.user;
  const logout = document.createElement('a'); logout.href = '/auth/lark/logout'; logout.textContent = 'Đăng xuất';
  el.append(avatar, name, logout);
}

async function initIdentity() {
  try {
    const res = await fetch('/api/me', { headers: { 'X-Dev-User': devUser } });
    if (res.ok) {
      const me = await res.json();
      isAuthenticated = true; devUser = me.user;
      renderAccount(me);
      document.getElementById('admin-tab').hidden = !me.is_admin;
      return;
    }
  } catch (e) { /* rơi xuống nhánh chưa đăng nhập */ }
  isAuthenticated = false;
  renderAccount(null);
}
initIdentity();

/* ========== Tab switching ========== */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');

    // Load data on first activation
    if (btn.dataset.tab === 'km-panel' && !kmLoaded) loadKnowledgeMap();
    if (btn.dataset.tab === 'catalog-panel' && !catalogLoaded) loadCatalogData();
  };
});

/* ========== Helpers ========== */
function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('vi-VN');
}
function fmtRowCount(n) { return n === null || n === undefined ? '—' : fmtNum(n) + ' dòng'; }
function fmtSize(bytes) {
  if (!bytes) return '—';
  const mb = bytes / (1024 * 1024);
  return mb < 1024 ? mb.toFixed(1) + ' MB' : (mb / 1024).toFixed(2) + ' GB';
}

function getSourceLayerClass(name) {
  if (!name) return 'default';
  if (name.startsWith('10_lsr')) return 'lake';
  if (name.startsWith('09_logic')) return 'logic';
  if (name.startsWith('dim_dwh')) return 'dim';
  if (name.startsWith('00_serving')) return 'serving';
  return 'default';
}

/* ========================================================================
   KNOWLEDGE MAP — D3.js force-directed graph
   ======================================================================== */

let kmLoaded = false;
let kmData = null;
let kmSimulation = null;

// Color palette for node types
const NODE_COLORS = {
  dataset: '#4A90D9',
  table: '#26A69A',
  view: '#7E57C2',
  kpi: '#FF9800',
};
const EDGE_COLORS = {
  contains: 'rgba(74, 144, 217, 0.45)',
  feeds: 'rgba(255, 152, 0, 0.55)',
  derives: 'rgba(126, 87, 194, 0.65)',
};

// Domain colors (generated from hash)
const DOMAIN_PALETTE = ['#4A90D9', '#26A69A', '#FF9800', '#AB47BC', '#EF5350', '#66BB6A', '#42A5F5', '#FFA726'];
const domainColorMap = {};
function domainColor(domain) {
  if (!domain) return '#888';
  if (!domainColorMap[domain]) {
    const idx = Object.keys(domainColorMap).length % DOMAIN_PALETTE.length;
    domainColorMap[domain] = DOMAIN_PALETTE[idx];
  }
  return domainColorMap[domain];
}

function nodeRadius(d) {
  if (d.type === 'dataset') return 32;
  if (d.type === 'kpi') return 15;
  // Table: scale by column count (proxy for complexity)
  const cols = d.metadata?.columns_count || 5;
  return Math.max(12, Math.min(24, 10 + Math.log2(cols) * 3));
}

function nodeColor(d) {
  if (d.type === 'dataset') return NODE_COLORS.dataset;
  if (d.type === 'kpi') return NODE_COLORS.kpi;
  if (d.type === 'table' && d.metadata?.table_type === 'VIEW') return NODE_COLORS.view;
  return NODE_COLORS.table;
}

async function loadKnowledgeMap() {
  const svg = d3.select('#km-svg');
  // Show loading
  svg.append('text')
    .attr('id', 'km-loading')
    .attr('x', '50%').attr('y', '50%')
    .attr('text-anchor', 'middle')
    .attr('fill', 'var(--ink-muted)')
    .attr('font-size', '14px')
    .text('Đang tải Knowledge Map...');

  try {
    kmData = await apiFetch('/api/dwh/graph');
    kmLoaded = true;
    svg.select('#km-loading').remove();
    buildKnowledgeMap(kmData);
    buildKmFilters(kmData);
  } catch (e) {
    svg.select('#km-loading').text('Lỗi: ' + e.message);
  }
}

function buildKmFilters(data) {
  const container = document.getElementById('km-filters');
  container.innerHTML = '';
  const datasets = [...new Set(data.nodes.filter(n => n.type === 'dataset').map(n => n.label))];

  // "All" chip
  const allChip = document.createElement('button');
  allChip.className = 'km-chip active';
  allChip.textContent = 'Tất cả';
  allChip.onclick = () => {
    container.querySelectorAll('.km-chip').forEach(c => c.classList.remove('active'));
    allChip.classList.add('active');
    filterKmGraph('', []);
  };
  container.appendChild(allChip);

  datasets.forEach(ds => {
    const chip = document.createElement('button');
    chip.className = 'km-chip';
    chip.textContent = ds.replace('00_serving_', '').replace(/_/g, ' ');
    chip.dataset.dataset = ds;
    chip.onclick = () => {
      container.querySelectorAll('.km-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      filterKmGraph('', [ds]);
    };
    container.appendChild(chip);
  });

  // KPI filter
  const kpiChip = document.createElement('button');
  kpiChip.className = 'km-chip';
  kpiChip.textContent = '📊 KPIs';
  kpiChip.onclick = () => {
    container.querySelectorAll('.km-chip').forEach(c => c.classList.remove('active'));
    kpiChip.classList.add('active');
    filterKmGraph('', [], true);
  };
  container.appendChild(kpiChip);
}

let activeFilter = { datasets: [], kpiOnly: false, search: '' };

function filterKmGraph(search, datasets, kpiOnly) {
  activeFilter = { search: search || '', datasets: datasets || [], kpiOnly: kpiOnly || false };
  const svg = d3.select('#km-svg');
  const q = activeFilter.search.toLowerCase();

  svg.selectAll('.node-group').each(function(d) {
    let visible = true;
    if (activeFilter.kpiOnly) {
      visible = d.type === 'kpi' || (d.type === 'table' && (d.metadata?.kpi_count || 0) > 0)
        || d.type === 'dataset';
    }
    if (activeFilter.datasets.length > 0 && d.type !== 'kpi') {
      visible = visible && (d.type === 'dataset' ? activeFilter.datasets.includes(d.label) : activeFilter.datasets.includes(d.group));
    }
    if (q) {
      visible = visible && d.label.toLowerCase().includes(q);
    }
    d3.select(this).style('opacity', visible ? 1 : 0.08).style('pointer-events', visible ? 'all' : 'none');
  });

  svg.selectAll('.edge-line').each(function(d) {
    const srcVisible = svg.select(`.node-group[data-id="${CSS.escape(d.source.id)}"]`).style('opacity') !== '0.08';
    const tgtVisible = svg.select(`.node-group[data-id="${CSS.escape(d.target.id)}"]`).style('opacity') !== '0.08';
    d3.select(this).style('opacity', (srcVisible && tgtVisible) ? null : 0.04);
  });
}

document.getElementById('km-search').addEventListener('input', (e) => {
  filterKmGraph(e.target.value, activeFilter.datasets, activeFilter.kpiOnly);
});

function buildKnowledgeMap(data) {
  const svgEl = document.getElementById('km-svg');
  const rect = svgEl.getBoundingClientRect();
  const width = rect.width || 900;
  const height = rect.height || 600;

  const svg = d3.select('#km-svg')
    .attr('viewBox', [0, 0, width, height]);

  // Clear previous
  svg.selectAll('*').remove();

  // Defs: arrowheads + glow filter
  const defs = svg.append('defs');

  // Arrowhead markers
  ['contains', 'feeds', 'derives'].forEach(type => {
    defs.append('marker')
      .attr('id', `arrow-${type}`)
      .attr('viewBox', '0 -4 8 8')
      .attr('refX', 22)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-4L8,0L0,4Z')
      .attr('fill', EDGE_COLORS[type]);
  });

  // Glow filter
  const glowFilter = defs.append('filter').attr('id', 'glow');
  glowFilter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  const merge = glowFilter.append('feMerge');
  merge.append('feMergeNode').attr('in', 'blur');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');

  // Dot grid background
  const pattern = defs.append('pattern')
    .attr('id', 'dot-grid')
    .attr('width', 24).attr('height', 24)
    .attr('patternUnits', 'userSpaceOnUse');
  pattern.append('circle')
    .attr('cx', 12).attr('cy', 12).attr('r', 0.8)
    .attr('fill', 'var(--border)');

  svg.append('rect')
    .attr('width', width).attr('height', height)
    .attr('fill', 'url(#dot-grid)')
    .attr('opacity', 0.7);

  // Main group for zoom/pan
  const g = svg.append('g').attr('class', 'graph-container');

  // Zoom behavior
  const zoom = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoom);

  // Zoom controls
  document.getElementById('km-zoom-in').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.4);
  document.getElementById('km-zoom-out').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 0.7);
  document.getElementById('km-zoom-reset').onclick = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

  // Prepare data (deep copy for D3 mutation)
  const nodes = data.nodes.map(d => ({ ...d, metadata: { ...d.metadata } }));
  const validNodeIds = new Set(nodes.map(n => n.id));
  const edges = data.edges
    .filter(e => validNodeIds.has(typeof e.source === 'object' ? e.source.id : e.source) && validNodeIds.has(typeof e.target === 'object' ? e.target.id : e.target))
    .map(d => ({ ...d }));

  // Force simulation
  kmSimulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d => d.id).distance(d => {
      if (d.type === 'contains') return 100;
      if (d.type === 'feeds') return 140;
      if (d.type === 'derives') return 120;
      return 110;
    }).strength(0.6))
    .force('charge', d3.forceManyBody().strength(d => {
      if (d.type === 'dataset') return -600;
      if (d.type === 'kpi') return -200;
      return -300;
    }))
    .force('x', d3.forceX(d => {
      if (d.type === 'dataset') return width * 0.12;
      if (d.type === 'kpi') return width * 0.88;
      return width * 0.48;
    }).strength(0.12))
    .force('y', d3.forceY(height / 2).strength(0.06))
    .force('collision', d3.forceCollide(d => nodeRadius(d) + 6));

  // Edges
  const edgeElements = g.append('g').attr('class', 'edges')
    .selectAll('line')
    .data(edges)
    .join('line')
    .attr('class', d => `edge-line ${d.type}`)
    .attr('stroke', d => EDGE_COLORS[d.type] || '#888')
    .attr('marker-end', d => `url(#arrow-${d.type})`);

  // Node groups
  const nodeGroups = g.append('g').attr('class', 'nodes')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', 'node-group')
    .attr('data-id', d => d.id);

  // Circles
  nodeGroups.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => nodeColor(d))
    .attr('stroke', d => nodeColor(d))
    .attr('stroke-width', d => d.type === 'table' && d.metadata?.table_type === 'VIEW' ? 2 : 0)
    .attr('fill-opacity', d => d.type === 'table' && d.metadata?.table_type === 'VIEW' ? 0.25 : 0.85)
    .attr('stroke-dasharray', d => d.type === 'table' && d.metadata?.table_type === 'VIEW' ? '4 2' : 'none');

  // Node icons/text inside
  nodeGroups.filter(d => d.type === 'dataset').append('text')
    .attr('text-anchor', 'middle').attr('dy', '0.35em')
    .attr('fill', '#fff').attr('font-size', '14px').attr('font-weight', '700')
    .attr('pointer-events', 'none')
    .text('🗄️');

  nodeGroups.filter(d => d.type === 'kpi').append('text')
    .attr('text-anchor', 'middle').attr('dy', '0.35em')
    .attr('fill', '#fff').attr('font-size', '10px').attr('font-weight', '700')
    .attr('pointer-events', 'none')
    .text('📊');

  // PII indicator (small red dot)
  nodeGroups.filter(d => d.type === 'table' && d.metadata?.has_pii).append('circle')
    .attr('cx', d => nodeRadius(d) * 0.6)
    .attr('cy', d => -nodeRadius(d) * 0.6)
    .attr('r', 4)
    .attr('fill', '#EF5350')
    .attr('stroke', 'var(--surface)')
    .attr('stroke-width', 1.5);

  // Labels below nodes
  nodeGroups.append('text')
    .attr('class', d => 'node-label' + (d.type === 'dataset' ? ' node-label-lg' : ''))
    .attr('dy', d => nodeRadius(d) + 14)
    .text(d => {
      if (d.type === 'dataset') return d.label.replace('00_serving_', '').replace(/_/g, ' ');
      if (d.label.length > 22) return d.label.substring(0, 20) + '…';
      return d.label;
    });

  // Drag behavior
  const drag = d3.drag()
    .on('start', (event, d) => {
      if (!event.active) kmSimulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on('end', (event, d) => {
      if (!event.active) kmSimulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
  nodeGroups.call(drag);

  // Tooltip
  const tooltip = document.getElementById('km-tooltip');

  nodeGroups.on('mouseover', (event, d) => {
    // Highlight connected
    const connectedIds = new Set([d.id]);
    edges.forEach(e => {
      const sid = typeof e.source === 'object' ? e.source.id : e.source;
      const tid = typeof e.target === 'object' ? e.target.id : e.target;
      if (sid === d.id) connectedIds.add(tid);
      if (tid === d.id) connectedIds.add(sid);
    });

    g.classed('km-dimmed', true);
    nodeGroups.classed('km-highlight', nd => connectedIds.has(nd.id));
    edgeElements.classed('km-highlight-edge', ed => {
      const sid = typeof ed.source === 'object' ? ed.source.id : ed.source;
      const tid = typeof ed.target === 'object' ? ed.target.id : ed.target;
      return sid === d.id || tid === d.id;
    });

    // Show tooltip
    let typeLabel = d.type === 'dataset' ? 'Dataset' : d.type === 'table' ? 'Bảng' : 'KPI';
    if (d.type === 'table' && d.metadata?.table_type === 'VIEW') typeLabel = 'View';
    const bgColor = nodeColor(d);

    let html = `<div class="km-tooltip-type" style="background:${bgColor}22;color:${bgColor};">${typeLabel}</div>`;
    html += `<div class="km-tooltip-title">${d.label}</div>`;

    if (d.type === 'table') {
      if (d.metadata.purpose) html += `<div class="km-tooltip-row">${d.metadata.purpose.substring(0, 100)}</div>`;
      html += `<div class="km-tooltip-row">📊 ${d.metadata.columns_count} cột · ${fmtRowCount(d.metadata.row_count)}</div>`;
      if (d.metadata.domain) html += `<div class="km-tooltip-row">🏷️ ${d.metadata.domain}</div>`;
    } else if (d.type === 'kpi') {
      if (d.metadata.business_definition) html += `<div class="km-tooltip-row">${d.metadata.business_definition.substring(0, 100)}</div>`;
      if (d.metadata.status) html += `<div class="km-tooltip-row">Status: ${d.metadata.status}</div>`;
    } else if (d.type === 'dataset') {
      html += `<div class="km-tooltip-row">${d.metadata.table_count} bảng · ${fmtNum(d.metadata.total_rows)} dòng</div>`;
    }

    tooltip.innerHTML = html;
    tooltip.classList.add('visible');
  })
  .on('mousemove', (event) => {
    const svgRect = svgEl.getBoundingClientRect();
    tooltip.style.left = (event.clientX - svgRect.left + 14) + 'px';
    tooltip.style.top = (event.clientY - svgRect.top - 10) + 'px';
  })
  .on('mouseout', () => {
    g.classed('km-dimmed', false);
    nodeGroups.classed('km-highlight', false);
    edgeElements.classed('km-highlight-edge', false);
    tooltip.classList.remove('visible');
  });

  // Click → detail panel
  nodeGroups.on('click', (event, d) => {
    event.stopPropagation();
    openKmDetail(d);
  });
  svg.on('click', () => closeKmDetail());

  // Tick
  kmSimulation.on('tick', () => {
    edgeElements
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeGroups.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

/* Knowledge Map — Detail panel */
function openKmDetail(d) {
  const panel = document.getElementById('km-detail');
  const headerEl = document.getElementById('km-detail-header-content');
  const bodyEl = document.getElementById('km-detail-body');
  const color = nodeColor(d);
  let typeLabel = d.type === 'dataset' ? 'Dataset' : d.type === 'table' ? 'Bảng' : 'KPI';
  if (d.type === 'table' && d.metadata?.table_type === 'VIEW') typeLabel = 'View';

  headerEl.innerHTML = `
    <div>
      <div class="km-detail-badge" style="background:${color}22;color:${color};">${typeLabel}</div>
      <h2 class="km-detail-title">${d.label}</h2>
    </div>`;

  bodyEl.innerHTML = '';

  if (d.type === 'dataset') {
    bodyEl.innerHTML = `
      <div class="km-detail-section">
        <div class="km-detail-meta-grid">
          <div class="km-detail-meta-item"><div class="km-detail-meta-label">Số bảng</div><div class="km-detail-meta-value">${d.metadata.table_count}</div></div>
          <div class="km-detail-meta-item"><div class="km-detail-meta-label">Tổng dòng</div><div class="km-detail-meta-value">${fmtNum(d.metadata.total_rows)}</div></div>
        </div>
      </div>
      <div class="km-detail-section">
        <div class="km-detail-section-title">Bảng trong dataset</div>
        <ul class="km-detail-list" id="km-detail-table-list"></ul>
      </div>`;
    const list = bodyEl.querySelector('#km-detail-table-list');
    kmData.nodes.filter(n => n.type === 'table' && n.group === d.label).forEach(t => {
      const li = document.createElement('li');
      li.innerHTML = `<span style="font-family:'DM Mono',monospace;font-weight:600;">${t.label}</span>`;
      li.style.cursor = 'pointer';
      li.onclick = () => openKmDetail(t);
      list.appendChild(li);
    });
  }

  else if (d.type === 'table') {
    const m = d.metadata;
    let html = `<button class="km-to-catalog-btn" onclick="goToCatalogTable('${m.table_id}')">📚 Xem chi tiết trong Data Catalog →</button>`;
    if (m.has_pii) {
      html += `<div class="catalog-pii-banner">⚠️ Bảng có dữ liệu nhạy cảm</div>`;
    }
    if (m.grain) {
      html += `<div class="catalog-detail-grain">
        <div class="catalog-detail-grain-icon">📐</div>
        <div><div class="catalog-detail-grain-label">Grain — 1 dòng nghĩa là gì</div>
        <div class="catalog-detail-grain-value">${m.grain}</div></div></div>`;
    }
    html += `<div class="km-detail-section"><div class="km-detail-meta-grid">
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Dataset</div><div class="km-detail-meta-value">${m.dataset}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Loại</div><div class="km-detail-meta-value">${m.table_type}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Domain</div><div class="km-detail-meta-value">${m.domain || '—'}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Số cột</div><div class="km-detail-meta-value">${m.columns_count}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Số dòng</div><div class="km-detail-meta-value">${fmtRowCount(m.row_count)}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Tần suất cập nhật</div><div class="km-detail-meta-value">${m.refresh || '—'}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Partition</div><div class="km-detail-meta-value" style="font-family:'DM Mono',monospace;">${m.partition_column || '—'}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Cluster</div><div class="km-detail-meta-value" style="font-family:'DM Mono',monospace;">${m.cluster || '—'}</div></div>
    </div></div>`;

    if (m.purpose) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Mục đích</div>
        <div class="km-detail-value">${m.purpose}</div></div>`;
    }

    // Upstream sources & Lineage
    if (m.source_info || (m.upstream_sources && m.upstream_sources.length)) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Nguồn dữ liệu & Lineage</div>
        <div class="km-detail-value" style="font-size:12.5px;color:var(--ink-secondary);margin-bottom:6px;">${m.source_info || '—'}</div>`;
      if (m.upstream_sources && m.upstream_sources.length) {
        html += `<div class="catalog-lineage-badges">` + m.upstream_sources.map(s => `<span class="source-badge ${getSourceLayerClass(s)}">${s}</span>`).join('') + `</div>`;
      }
      html += `</div>`;
    }

    // Keys & Joins
    if (m.keys_info) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Khóa & Kết nối</div>
        <div class="km-detail-value" style="font-size:12.5px;">${m.keys_info}</div></div>`;
    }

    // Transformation logic
    if (m.transformation) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Logic xử lý & Biến đổi</div>
        <div class="km-detail-value" style="font-size:12.5px;">${m.transformation}</div></div>`;
    }

    // Use when / Not use when / Notes
    if (m.use_when) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Dùng khi</div>
        <div class="km-detail-value" style="font-size:12.5px;color:var(--good);">${m.use_when}</div></div>`;
    }
    if (m.not_use_when) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Không dùng khi</div>
        <div class="km-detail-value" style="font-size:12.5px;color:var(--warning-ink);">${m.not_use_when}</div></div>`;
    }
    if (m.notes) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Lưu ý</div>
        <div class="catalog-notes-box">${m.notes}</div></div>`;
    }

    // Intra-serving derivations (table lineage)
    const derivedFrom = kmData.edges
      .filter(e => {
        const tid = typeof e.target === 'object' ? e.target.id : e.target;
        return tid === d.id && e.type === 'derives';
      })
      .map(e => {
        const sid = typeof e.source === 'object' ? e.source.id : e.source;
        return kmData.nodes.find(n => n.id === sid);
      }).filter(Boolean);

    const feedsToTables = kmData.edges
      .filter(e => {
        const sid = typeof e.source === 'object' ? e.source.id : e.source;
        return sid === d.id && e.type === 'derives';
      })
      .map(e => {
        const tid = typeof e.target === 'object' ? e.target.id : e.target;
        return kmData.nodes.find(n => n.id === tid);
      }).filter(Boolean);

    if (derivedFrom.length > 0) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Kế thừa từ bảng (${derivedFrom.length})</div><ul class="km-detail-list">`;
      derivedFrom.forEach(p => {
        html += `<li style="cursor:pointer" onclick="openKmDetail(kmData.nodes.find(n=>n.id==='${p.id.replace(/'/g, "\\'")}'))">
          <span style="color:${nodeColor(p)};">⬤</span> <strong>${p.label}</strong>
          <span style="margin-left:auto;font-size:10px;color:var(--ink-muted);">${p.group.replace('00_serving_','')}</span>
        </li>`;
      });
      html += '</ul></div>';
    }

    if (feedsToTables.length > 0) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Cung cấp dữ liệu cho bảng (${feedsToTables.length})</div><ul class="km-detail-list">`;
      feedsToTables.forEach(ch => {
        html += `<li style="cursor:pointer" onclick="openKmDetail(kmData.nodes.find(n=>n.id==='${ch.id.replace(/'/g, "\\'")}'))">
          <span style="color:${nodeColor(ch)};">⬤</span> <strong>${ch.label}</strong>
          <span style="margin-left:auto;font-size:10px;color:var(--ink-muted);">${ch.group.replace('00_serving_','')}</span>
        </li>`;
      });
      html += '</ul></div>';
    }

    // Connected KPIs
    const connectedKpis = kmData.edges
      .filter(e => {
        const sid = typeof e.source === 'object' ? e.source.id : e.source;
        return sid === d.id && e.type === 'feeds';
      })
      .map(e => {
        const tid = typeof e.target === 'object' ? e.target.id : e.target;
        return kmData.nodes.find(n => n.id === tid);
      }).filter(Boolean);

    if (connectedKpis.length > 0) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">KPIs được cung cấp dữ liệu (${connectedKpis.length})</div><ul class="km-detail-list">`;
      connectedKpis.forEach(k => {
        html += `<li style="cursor:pointer" onclick="openKmDetail(kmData.nodes.find(n=>n.id==='${k.id.replace(/'/g, "\\'")}'))">
          <span style="color:${NODE_COLORS.kpi};">📊</span> ${k.label}
          ${k.metadata.status ? `<span style="margin-left:auto;font-size:10px;color:var(--ink-muted);">${k.metadata.status}</span>` : ''}
        </li>`;
      });
      html += '</ul></div>';
    }

    bodyEl.innerHTML = html;
  }

  else if (d.type === 'kpi') {
    const m = d.metadata;
    let html = `<div class="km-detail-section"><div class="km-detail-meta-grid">
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Status</div><div class="km-detail-meta-value">${m.status || '—'}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Domain</div><div class="km-detail-meta-value">${m.domain || '—'}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Grain</div><div class="km-detail-meta-value">${m.grain || '—'}</div></div>
      <div class="km-detail-meta-item"><div class="km-detail-meta-label">Owner</div><div class="km-detail-meta-value">${m.owner || '—'}</div></div>
    </div></div>`;

    if (m.business_definition) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Định nghĩa</div>
        <div class="km-detail-value">${m.business_definition}</div></div>`;
    }
    if (m.formula) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Công thức</div>
        <div class="km-detail-formula">${m.formula}</div></div>`;
    }
    if (m.time_rule) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Quy tắc thời gian</div>
        <div class="km-detail-value">${m.time_rule}</div></div>`;
    }

    // Source tables
    const sourceTables = kmData.edges
      .filter(e => {
        const tid = typeof e.target === 'object' ? e.target.id : e.target;
        return tid === d.id && e.type === 'feeds';
      })
      .map(e => {
        const sid = typeof e.source === 'object' ? e.source.id : e.source;
        return kmData.nodes.find(n => n.id === sid);
      }).filter(Boolean);

    if (sourceTables.length > 0) {
      html += `<div class="km-detail-section"><div class="km-detail-section-title">Bảng nguồn (${sourceTables.length})</div><ul class="km-detail-list">`;
      sourceTables.forEach(t => {
        html += `<li style="cursor:pointer" onclick="openKmDetail(kmData.nodes.find(n=>n.id==='${t.id.replace(/'/g, "\\'")}'))">
          <span style="color:${nodeColor(t)};">⬤</span> ${t.label}
          <span style="margin-left:auto;font-size:10px;color:var(--ink-muted);">${t.group.replace('00_serving_','')}</span>
        </li>`;
      });
      html += '</ul></div>';
    }

    bodyEl.innerHTML = html;
  }

  panel.classList.add('open');
}

/* ========================================================================
   DATA CATALOG
   ======================================================================== */

let catalogLoaded = false;
let catalogData = null;
let catalogFilters = { datasets: new Set(), search: '', piiOnly: false };

const DATASET_LABELS = {
  '00_serving_sales': 'Sales',
  '00_serving_inventory': 'Inventory',
  '00_serving_operation': 'Operation',
};

const DATASET_ACCENT_COLORS = {
  '00_serving_sales': '#4A90D9',
  '00_serving_inventory': '#26A69A',
  '00_serving_operation': '#FF9800',
};

async function loadCatalogData() {
  try {
    catalogData = await apiFetch('/api/dwh/catalog');
    catalogLoaded = true;
    renderCatalogStats(catalogData);
    renderCatalogFilters(catalogData);
    renderCatalogCards(catalogData.tables);
  } catch (e) {
    document.getElementById('catalog-grid').innerHTML = `<p class="empty-state">Lỗi: ${e.message}</p>`;
  }
}

function renderCatalogStats(data) {
  const container = document.getElementById('catalog-stats');
  const totalCols = data.tables.reduce((s, t) => s + (t.columns?.length || 0), 0);
  const totalRows = data.tables.reduce((s, t) => s + (t.row_count || 0), 0);
  const datasets = new Set(data.tables.map(t => t.dataset));

  container.innerHTML = `
    <div class="stat-card"><div class="stat-card-value">${data.tables.length}</div><div class="stat-card-label">Bảng dữ liệu</div></div>
    <div class="stat-card"><div class="stat-card-value">${fmtNum(totalCols)}</div><div class="stat-card-label">Cột tổng cộng</div></div>
    <div class="stat-card"><div class="stat-card-value">${data.kpis.length}</div><div class="stat-card-label">KPIs</div></div>
    <div class="stat-card"><div class="stat-card-value">${datasets.size}</div><div class="stat-card-label">Dataset</div></div>
    <div class="stat-card"><div class="stat-card-value">${fmtNum(totalRows)}</div><div class="stat-card-label">Tổng dòng dữ liệu</div></div>
  `;
}

function renderCatalogFilters(data) {
  const container = document.getElementById('catalog-filters');
  container.innerHTML = '';

  const label = document.createElement('span');
  label.className = 'catalog-filter-label';
  label.textContent = 'Lọc:';
  container.appendChild(label);

  const datasets = [...new Set(data.tables.map(t => t.dataset))].sort();
  datasets.forEach(ds => {
    const chip = document.createElement('button');
    chip.className = 'catalog-chip';
    chip.textContent = DATASET_LABELS[ds] || ds;
    chip.onclick = () => {
      if (catalogFilters.datasets.has(ds)) { catalogFilters.datasets.delete(ds); chip.classList.remove('active'); }
      else { catalogFilters.datasets.add(ds); chip.classList.add('active'); }
      applyCatalogFilters();
    };
    container.appendChild(chip);
  });

  const piiChip = document.createElement('button');
  piiChip.className = 'catalog-chip';
  piiChip.textContent = '⚠️ Có PII';
  piiChip.onclick = () => {
    catalogFilters.piiOnly = !catalogFilters.piiOnly;
    piiChip.classList.toggle('active');
    applyCatalogFilters();
  };
  container.appendChild(piiChip);
}

document.getElementById('catalog-search').addEventListener('input', (e) => {
  catalogFilters.search = e.target.value.trim().toLowerCase();
  applyCatalogFilters();
});

function applyCatalogFilters() {
  if (!catalogData) return;
  const q = catalogFilters.search;
  const filtered = catalogData.tables.filter(t => {
    if (catalogFilters.datasets.size > 0 && !catalogFilters.datasets.has(t.dataset)) return false;
    if (catalogFilters.piiOnly && !t.has_pii) return false;
    if (q) {
      const haystack = [
        t.table_name, t.purpose, t.description, t.domain, t.grain,
        t.keys_info, t.source_info, t.transformation, t.scope, t.use_when, t.not_use_when, t.notes,
        ...(t.upstream_sources || []),
        ...(t.columns || []).map(c => [
          c.name, c.friendly_name, c.description, c.calculation_logic, c.example,
          ...(c.sentinel_values || []).map(s => s.value + ' ' + s.meaning)
        ].join(' ')),
        ...(t.kpi_names || []),
      ].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
  renderCatalogCards(filtered);
}

function renderCatalogCards(tables) {
  const grid = document.getElementById('catalog-grid');
  const info = document.getElementById('catalog-results-info');
  grid.innerHTML = '';

  if (catalogData) {
    info.textContent = `Hiển thị ${tables.length} / ${catalogData.tables.length} bảng`;
  }

  if (tables.length === 0) {
    grid.innerHTML = '<p class="empty-state">Không tìm thấy bảng nào phù hợp.</p>';
    return;
  }

  tables.forEach(t => {
    const card = document.createElement('div');
    card.className = 'catalog-card';
    card.onclick = () => openCatalogDetail(t.table_id);

    const accent = document.createElement('div');
    accent.className = 'catalog-card-accent';
    accent.style.background = `linear-gradient(90deg, ${DATASET_ACCENT_COLORS[t.dataset] || '#888'}, ${DATASET_ACCENT_COLORS[t.dataset] || '#888'}44)`;
    card.appendChild(accent);

    const body = document.createElement('div');
    body.className = 'catalog-card-body';

    const header = document.createElement('div');
    header.className = 'catalog-card-header';
    const name = document.createElement('div');
    name.className = 'catalog-card-name';
    name.textContent = t.table_name;
    const badge = document.createElement('span');
    badge.className = 'catalog-card-dataset-badge';
    badge.textContent = DATASET_LABELS[t.dataset] || t.dataset;
    header.appendChild(name);
    header.appendChild(badge);
    body.appendChild(header);

    const desc = document.createElement('div');
    desc.className = 'catalog-card-desc';
    desc.textContent = t.purpose || t.description || '(chưa có mô tả)';
    body.appendChild(desc);

    const meta = document.createElement('div');
    meta.className = 'catalog-card-meta';
    meta.innerHTML = `<span class="catalog-card-tag">📊 ${(t.columns || []).length} cột</span>
      <span class="catalog-card-tag">📝 ${fmtRowCount(t.row_count)}</span>`;
    if (t.grain) meta.innerHTML += `<span class="catalog-card-tag">📐 ${t.grain.substring(0, 40)}</span>`;
    if (t.upstream_sources && t.upstream_sources.length > 0) {
      meta.innerHTML += `<span class="catalog-card-tag">🔗 ${t.upstream_sources.length} nguồn</span>`;
    }
    if (t.kpi_names && t.kpi_names.length > 0) {
      meta.innerHTML += `<span class="catalog-card-tag">📈 ${t.kpi_names.length} KPI</span>`;
    }
    if (t.has_pii) meta.innerHTML += `<span class="catalog-card-pii">PII</span>`;
    if (t.table_type === 'VIEW') meta.innerHTML += `<span class="catalog-card-view-badge">VIEW</span>`;
    body.appendChild(meta);

    card.appendChild(body);
    grid.appendChild(card);
  });
}

/* Catalog Detail View */

    keyTitle.textContent = 'Khóa & Khả năng kết nối (Keys & Joins)';
    detail.appendChild(keyTitle);
    const keyBox = document.createElement('div');
    keyBox.className = 'catalog-lineage-box';
    keyBox.style.fontFamily = "'DM Mono', monospace";
    keyBox.style.fontSize = '12.5px';
    keyBox.textContent = t.keys_info;
    detail.appendChild(keyBox);
  }

  // Upstream Lineage
  if (t.source_info || (t.upstream_sources && t.upstream_sources.length)) {
    const srcTitle = document.createElement('h3');
    srcTitle.className = 'catalog-section-title';
    srcTitle.textContent = 'Nguồn dữ liệu & Lineage';
    detail.appendChild(srcTitle);
    const srcBox = document.createElement('div');
    srcBox.className = 'catalog-lineage-box';
    if (t.source_info) {
      const desc = document.createElement('div');
      desc.className = 'catalog-lineage-desc';
      desc.textContent = t.source_info;
      srcBox.appendChild(desc);
    }
    if (t.upstream_sources && t.upstream_sources.length) {
      const badges = document.createElement('div');
      badges.className = 'catalog-lineage-badges';
      t.upstream_sources.forEach(s => {
        const span = document.createElement('span');
        span.className = `source-badge ${getSourceLayerClass(s)}`;
        span.textContent = s;
        badges.appendChild(span);
      });
      srcBox.appendChild(badges);
    }
    detail.appendChild(srcBox);
  }

  // Transformation logic & Rules
  if (t.transformation || t.scope || t.use_when || t.not_use_when || t.notes) {
    const transTitle = document.createElement('h3');
    transTitle.className = 'catalog-section-title';
    transTitle.textContent = 'Logic xử lý & Quy tắc nghiệp vụ';
    detail.appendChild(transTitle);
    const transBox = document.createElement('div');
    transBox.className = 'catalog-lineage-box';
    let tHtml = '';
    if (t.transformation) tHtml += `<div style="margin-bottom:8px;"><strong>Đã xử lý:</strong> ${t.transformation}</div>`;
    if (t.scope) tHtml += `<div style="margin-bottom:8px;"><strong>Phạm vi:</strong> ${t.scope}</div>`;
    if (t.use_when) tHtml += `<div style="margin-bottom:8px;color:var(--good);"><strong>✓ Dùng khi:</strong> ${t.use_when}</div>`;
    if (t.not_use_when) tHtml += `<div style="margin-bottom:8px;color:var(--warning-ink);"><strong>✕ Không dùng khi:</strong> ${t.not_use_when}</div>`;
    if (t.notes) tHtml += `<div class="catalog-notes-box" style="margin-top:10px;margin-bottom:0;"><strong>Lưu ý:</strong> ${t.notes}</div>`;
    transBox.innerHTML = tHtml;
    detail.appendChild(transBox);
  }

  // SQL View Definition
  if (t.view_definition) {
    const sqlTitle = document.createElement('h3');
    sqlTitle.className = 'catalog-section-title';
    sqlTitle.textContent = 'SQL định nghĩa (View Definition)';
    detail.appendChild(sqlTitle);

    const wrap = document.createElement('div');
    wrap.className = 'catalog-sql-wrap';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'catalog-copy-btn';
    copyBtn.textContent = 'Sao chép SQL';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(t.view_definition).then(() => {
        copyBtn.textContent = '✓ Đã sao chép';
        setTimeout(() => copyBtn.textContent = 'Sao chép SQL', 2000);
      });
    };
    const code = document.createElement('code');
    code.textContent = t.view_definition;
    wrap.append(copyBtn, code);
    detail.appendChild(wrap);
  }

  // KPIs
  if (t.kpi_names && t.kpi_names.length > 0) {
    const kpiTitle = document.createElement('h3');
    kpiTitle.className = 'catalog-section-title';
    kpiTitle.textContent = `Chỉ số KPI liên quan (${t.kpi_names.length})`;
    detail.appendChild(kpiTitle);

    const kpiRow = document.createElement('div');
    t.kpi_names.forEach(name => {
      const kpi = catalogData.kpis.find(k => k.name === name);
      const chip = document.createElement('span');
      chip.className = 'catalog-kpi-chip';
      const dot = document.createElement('span');
      dot.className = 'catalog-kpi-status';
      dot.style.background = kpi && kpi.status === 'Active' ? 'var(--good)' : 'var(--ink-muted)';
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(name));
      kpiRow.appendChild(chip);
    });
    detail.appendChild(kpiRow);
  }

  // Column dictionary
  const colTitle = document.createElement('h3');
  colTitle.className = 'catalog-section-title';
  colTitle.textContent = `Từ điển cột (${(t.columns || []).length})`;
  detail.appendChild(colTitle);

  if (t.columns && t.columns.length > 0) {
    const wrap = document.createElement('div');
    wrap.className = 'scroll-table-wrap';
    const table = document.createElement('table');
    table.className = 'catalog-col-table';
    table.innerHTML = `<thead><tr>
      <th>Tên cột</th><th>Tên thân thiện</th><th>Kiểu</th><th>Mô tả / Business Definition</th><th>Logic xử lý & Ví dụ</th>
    </tr></thead>`;
    const tbody = document.createElement('tbody');

    t.columns.forEach(c => {
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.innerHTML = `<span class="catalog-col-name">${c.name}</span>`;
      const tdFriendly = document.createElement('td');
      tdFriendly.textContent = c.friendly_name || '—';
      const tdType = document.createElement('td');
      tdType.innerHTML = `<span class="catalog-col-type">${c.type}</span>`;
      const tdDesc = document.createElement('td');
      tdDesc.className = 'catalog-col-desc';
      tdDesc.textContent = c.description || '—';
      if (c.sentinel_values && c.sentinel_values.length > 0) {
        c.sentinel_values.forEach(s => {
          const note = document.createElement('div');
          note.className = 'sentinel-note-inline';
          note.textContent = `⚠️ ${s.value} = ${s.meaning}`;
          tdDesc.appendChild(note);
        });
      }

      const tdLogic = document.createElement('td');
      if (c.calculation_logic) {
        const calc = document.createElement('div');
        calc.className = 'catalog-col-calc';
        calc.textContent = c.calculation_logic;
        tdLogic.appendChild(calc);
      }
      if (c.example) {
        const ex = document.createElement('div');
        ex.className = 'catalog-col-example';
        ex.textContent = `Ví dụ: ${c.example}`;
        tdLogic.appendChild(ex);
      }
      if (!c.calculation_logic && !c.example) {
        tdLogic.textContent = '—';
      }

      tr.append(tdName, tdFriendly, tdType, tdDesc, tdLogic);
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    wrap.appendChild(table);
    detail.appendChild(wrap);
  }

  // Related tables
  if (t.related_tables && t.related_tables.length > 0) {
    const relTitle = document.createElement('h3');
    relTitle.className = 'catalog-section-title';
    relTitle.textContent = `Bảng liên quan — cột chung (${t.related_tables.length})`;
    detail.appendChild(relTitle);

    t.related_tables.forEach(rel => {
      const card = document.createElement('div');
      card.className = 'catalog-related-table';
      card.onclick = () => openCatalogDetail(rel.table_id);
      card.innerHTML = `
        <div>
          <div class="catalog-related-name">${rel.table_name}</div>
          <div class="catalog-related-info">${DATASET_LABELS[rel.dataset] || rel.dataset} · ${rel.shared_count} cột chung</div>
          <div class="catalog-related-cols">${rel.shared_columns.slice(0, 8).join(', ')}${rel.shared_columns.length > 8 ? '...' : ''}</div>
        </div>`;
      detail.appendChild(card);
    });
  }

  // Scroll to top
  document.getElementById('catalog-panel').scrollTop = 0;
}

function closeCatalogDetail() {
  document.getElementById('catalog-list').classList.remove('hidden-view');
  document.getElementById('catalog-detail').classList.remove('active');
  document.getElementById('catalog-detail').innerHTML = '';
}

/* ========== Cross-Tab Navigation Helpers ========== */
function goToCatalogTable(tableId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-catalog').classList.add('active');
  document.getElementById('catalog-panel').classList.add('active');
  if (!catalogLoaded) {
    loadCatalogData().then(() => openCatalogDetail(tableId));
  } else {
    openCatalogDetail(tableId);
  }
}

function goToKnowledgeMap(tableId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-km').classList.add('active');
  document.getElementById('km-panel').classList.add('active');
  if (!kmLoaded) {
    loadKnowledgeMap().then(() => highlightAndCenterTable(tableId));
  } else {
    highlightAndCenterTable(tableId);
  }
}

function highlightAndCenterTable(tableId) {
  const node = kmData?.nodes.find(n => n.id === `table:${tableId}`);
  if (!node) return;
  openKmDetail(node);
  const svg = d3.select('#km-svg');
  const svgEl = document.getElementById('km-svg');
  const rect = svgEl.getBoundingClientRect();
  const width = rect.width || 900;
  const height = rect.height || 600;
  svg.transition().duration(600).call(
    d3.zoom().transform,
    d3.zoomIdentity.translate(width / 2 - node.x * 1.5, height / 2 - node.y * 1.5).scale(1.5)
  );
}

</script>
