<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LSR Data Explorer</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="stylesheet" href="/theme.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- Sidebar + top bar dùng chung 3 trang (index/embeds/admin) ---------- */
  .sidebar {
    width: 208px; flex-shrink: 0; background: var(--surface-2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 20px 12px; gap: 2px; overflow-y: auto;
  }
  .sidebar-title { padding: 0 10px 18px; }
  .sidebar-logo { display: block; width: 100%; height: auto; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sidebar-logo { filter: invert(1); } }
  :root[data-theme="dark"] .sidebar-logo { filter: invert(1); }
  .sidebar-link {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink-secondary); text-decoration: none;
  }
  .sidebar-link:hover { background: var(--surface); color: var(--ink-primary); }
  .sidebar-link.active { background: var(--surface); color: var(--series-1); }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  #theme-toggle-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-primary);
    border-radius: 6px; padding: 5px 9px; cursor: pointer; font-size: 12px;
  }
  .account-cluster { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-secondary); }
  .account-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--series-1); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; flex-shrink: 0;
  }
  .account-cluster a { color: var(--series-1); font-weight: 600; text-decoration: none; }

  .app-content { display: flex; flex: 1; min-height: 0; }

  /* ---------- Chat pane (Advisor) ---------- */
  #chat-pane {
    width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--surface); border-right: 1px solid var(--border);
  }
  #chat-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  #chat-header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #chat-header p { font-size: 12px; color: var(--ink-muted); margin: 4px 0 0; }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 13px; border-radius: 12px; white-space: pre-wrap; font-size: 13.5px; line-height: 1.5; max-width: 92%; }
  .msg.user { background: var(--user-bubble); align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg.advisor { background: var(--surface-2); align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.refuse { background: var(--surface-2); border: 1px solid var(--critical); align-self: flex-start; border-bottom-left-radius: 3px; }

  .unsuitable-card { align-self: flex-start; max-width: 92%; font-size: 12px; color: var(--ink-muted); padding: 2px 4px; }

  #clarify-options { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 10px; }
  .clarify-group { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .clarify-question { font-size: 12.5px; font-weight: 600; margin-bottom: 8px; }
  .clarify-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .clarify-pill {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-primary);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  .clarify-pill:hover { background: var(--series-1-wash); }
  .clarify-pill.selected { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .clarify-extra-row { display: flex; gap: 6px; }
  .clarify-extra-row input {
    flex: 1; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink-primary); font-size: 12.5px;
  }
  .clarify-extra-row button {
    padding: 7px 12px; border: none; border-radius: 8px; background: var(--series-1);
    color: #fff; font-weight: 600; cursor: pointer; font-size: 12.5px; white-space: nowrap;
  }

  #input-row { display: flex; padding: 12px 14px; border-top: 1px solid var(--border); gap: 8px; }
  #input-row input {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink-primary); font-size: 13.5px;
  }
  #input-row button {
    padding: 9px 16px; border: none; border-radius: 8px; background: var(--series-1);
    color: #fff; font-weight: 600; cursor: pointer; font-size: 13.5px;
  }
  button:disabled, button.is-busy { opacity: 0.6; cursor: default; }

  /* ---------- Explorer pane ---------- */
  #explorer-pane { flex: 1; padding: 28px 32px; overflow-y: auto; }
  #explorer-header { display:flex; align-items:center; justify-content:space-between; gap: 16px; margin-bottom: 18px; }
  #explorer-header h2 { font-size: 20px; font-weight: 650; margin: 0; }

  #search-row { margin-bottom: 16px; }
  #search-input {
    width: 100%; max-width: 420px; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--ink-primary); font-size: 13.5px;
  }

  .dataset-group { margin-bottom: 22px; }
  .dataset-group h3 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-muted); margin: 0 0 8px;
  }
  .table-list { display: flex; flex-direction: column; gap: 8px; }
  .table-row {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--surface); cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .table-row:hover { background: var(--surface-2); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
  .table-row-main { flex: 1; min-width: 0; }
  .table-row-name { font-size: 13.5px; font-weight: 600; font-family: 'DM Mono', ui-monospace, monospace; }
  .table-row-desc {
    font-size: 12.5px; color: var(--ink-secondary); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .table-row-stats { font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; text-align: right; }
  .pii-badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: var(--warning-bg); color: var(--warning-ink); margin-left: 8px;
  }

  /* ---------- Table detail ---------- */
  #back-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-primary);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; margin-bottom: 16px;
  }
  #back-btn:hover { background: var(--surface-2); }
  .detail-title { font-size: 19px; font-weight: 650; font-family: 'DM Mono', ui-monospace, monospace; margin: 0 0 4px; }
  .detail-dataset { font-size: 12px; color: var(--ink-muted); margin: 0 0 14px; }
  .detail-meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 12px; margin-bottom: 18px;
  }
  .detail-meta-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .detail-meta-item:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
  .detail-meta-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-muted); margin-bottom: 4px;
  }
  .detail-meta-value { font-size: 13px; line-height: 1.45; }
  .pii-banner {
    background: var(--warning-bg); color: var(--warning-ink); border-radius: 8px; padding: 9px 12px;
    font-size: 12.5px; margin-bottom: 16px;
  }
  .kpi-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .kpi-chip {
    font-size: 12px; background: var(--surface-2); border-radius: 999px; padding: 4px 10px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  h4.section-title { font-size: 13px; font-weight: 650; margin: 22px 0 10px; }
  .scroll-table { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table.data-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.data-table th, table.data-table td {
    padding: 7px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border);
  }
  table.data-table th {
    background: var(--surface-2); position: sticky; top: 0; font-weight: 650; color: var(--ink-secondary);
  }
  table.data-table td { font-variant-numeric: tabular-nums; }
  table.data-table tbody tr:last-child td { border-bottom: none; }
  .null-cell { color: var(--ink-muted); font-style: italic; }

  #preview-btn {
    padding: 9px 16px; border: none; border-radius: 8px; background: var(--series-1);
    color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 6px;
  }
  #preview-btn:hover { opacity: 0.9; }
  .empty-state { color: var(--ink-muted); font-size: 13.5px; }

  /* Grain là thứ quyết định user đọc số liệu đúng hay sai (1 dòng là gì) — tách
     riêng khỏi lưới meta chung, làm nổi bật bằng viền + nền accent thay vì 1 ô
     bình thường dễ bị lướt qua. */
  .grain-callout {
    display: flex; gap: 10px; align-items: flex-start; background: var(--series-1-wash);
    border: 1px solid var(--series-1); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
  }
  .grain-callout-icon { font-size: 18px; line-height: 1.3; }
  .grain-callout-label {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--series-1); margin-bottom: 3px;
  }
  .grain-callout-value { font-size: 13.5px; font-weight: 600; line-height: 1.45; }

  .sentinel-note {
    display: inline-block; font-size: 11px; color: var(--warning-ink); background: var(--warning-bg);
    border-radius: 6px; padding: 1px 7px; margin-top: 4px;
  }
  th[title], td.sentinel-cell { cursor: help; }
  td.sentinel-cell { color: var(--warning-ink); background: color-mix(in srgb, var(--warning-bg) 35%, transparent); font-style: italic; }
  .ordering-note { font-size: 11.5px; color: var(--ink-muted); margin-bottom: 8px; }

  #cancel-filter-btn {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); color: var(--ink-secondary);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  #cancel-filter-btn:hover { background: var(--surface-2); color: var(--ink-primary); }
  #filter-reason {
    font-size: 12.5px; color: var(--ink-secondary); background: var(--series-1-wash);
    border-radius: 8px; padding: 8px 12px; margin: -6px 0 14px;
  }
  .table-row-why { font-size: 12px; color: var(--series-1); margin-top: 4px; }
  .table-row-caveat { font-size: 11.5px; color: var(--warning-ink); margin-top: 3px; }

  /* ---------- Advisor: bold + đẩy lên đầu (KHÔNG còn ẩn bảng không khớp) ---------- */
  .table-row-checkbox { flex-shrink: 0; width: 17px; height: 17px; accent-color: var(--series-1); cursor: pointer; }
  .table-row.recommended {
    border-color: var(--series-1); background: var(--series-1-wash);
  }
  .table-row.recommended .table-row-name { font-weight: 750; }
  .recommended-section-title {
    font-size: 12px; font-weight: 700; color: var(--series-1); margin: 0 0 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .others-section-title {
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-muted); margin: 22px 0 12px; padding-top: 14px; border-top: 1px solid var(--border);
  }

  /* ---------- Khay "Bảng đang chọn" ---------- */
  #selection-tray {
    position: sticky; bottom: 0; margin-top: 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 -4px 16px rgba(0,0,0,.08);
  }
  #selection-tray-title { font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
  #selection-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .selection-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2);
    border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 12.5px;
    font-family: 'DM Mono', ui-monospace, monospace;
  }
  .selection-chip button {
    border: none; background: transparent; color: var(--ink-muted); cursor: pointer;
    font-size: 14px; line-height: 1; width: 20px; height: 20px; border-radius: 50%;
  }
  .selection-chip button:hover { background: var(--border); color: var(--ink-primary); }
  #selection-tray-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  #selection-tray-hint { font-size: 11px; font-style: italic; color: var(--ink-muted); margin-right: auto; }
  .tray-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-primary);
    border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .tray-btn:hover { background: var(--surface-2); }
  .tray-btn.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
  .tray-btn.primary:hover { opacity: 0.9; }
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-title"><img src="/logo.png" class="sidebar-logo" alt="Lamson Retail Group"></div>
  <a href="/guide.html" class="sidebar-link">📘 Hướng dẫn</a>
  <a href="/" class="sidebar-link active">🗂️ Tư vấn chọn bảng</a>
  <a href="/embeds.html" class="sidebar-link" id="embeds-tab">📊 Nhúng dashboard vào Lark</a>
  <a href="/admin.html" class="sidebar-link" id="admin-tab" hidden>🛠️ Quản trị</a>
</nav>

<div class="main-col">
<div class="topbar">
  <button id="theme-toggle-btn" title="Đổi giao diện sáng/tối">◐</button>
  <div class="account-cluster" id="account-cluster"></div>
</div>

<div class="app-content">

<div id="chat-pane">
  <div id="chat-header">
    <h1>Tư vấn chọn bảng</h1>
    <p>Mô tả báo cáo bạn muốn làm — mình gợi ý bảng dữ liệu phù hợp.</p>
  </div>
  <div id="messages"></div>
  <div id="input-row">
    <input id="message-input" placeholder="Mô tả báo cáo bạn muốn làm..." disabled />
    <button id="send-btn" disabled>Gửi</button>
  </div>
</div>

<div id="explorer-pane">
  <div id="list-view">
    <div id="explorer-header">
      <h2 id="explorer-title">Bảng dữ liệu Serving</h2>
      <button id="cancel-filter-btn" hidden>✕ Bỏ gợi ý</button>
    </div>
    <p id="filter-reason" hidden></p>
    <div id="search-row">
      <input id="search-input" placeholder="Tìm theo tên bảng hoặc mô tả..." />
    </div>
    <div id="table-groups"><p class="empty-state">Đang tải danh sách bảng...</p></div>

    <div id="selection-tray" hidden>
      <div id="selection-tray-title">Bảng đang chọn</div>
      <div id="selection-chip-row"></div>
      <div id="selection-tray-actions">
        <span id="selection-tray-hint">Preview chỉ lấy 50 dòng/bảng để tham khảo cấu trúc.</span>
        <button type="button" class="tray-btn" id="copy-prompt-btn">📋 Copy prompt</button>
        <button type="button" class="tray-btn primary" id="export-selection-btn">📄 Tải data preview kèm mô tả</button>
      </div>
    </div>
  </div>

  <div id="detail-view" hidden>
    <button id="back-btn">← Quay lại danh sách</button>
    <div id="detail-body"></div>
  </div>
</div>

</div>
</div>

<script src="app.js"></script>
<script>
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById('theme-toggle-btn').onclick = () => {
    const isDark = document.documentElement.dataset.theme === 'dark'
      || (!document.documentElement.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
  };
})();

// Không còn prompt() xin dev-user mặc định — production yêu cầu đăng nhập Lark thật
// (X-Dev-User chỉ có tác dụng khi server bật ALLOW_DEV_USER_HEADER=true, tức máy dev
// cục bộ). Header vẫn gửi kèm (vô hại) để dev cục bộ dùng được mà không cần đổi gì thêm.
let devUser = localStorage.getItem('dev_user') || 'dev@local';
let isAuthenticated = false;

function renderAccount(me) {
  const el = document.getElementById('account-cluster');
  el.innerHTML = '';
  if (!me) {
    const login = document.createElement('a'); login.href = '/auth/lark/login'; login.textContent = 'Đăng nhập Lark';
    el.appendChild(login);
    return;
  }
  const avatar = document.createElement('div');
  avatar.className = 'account-avatar';
  avatar.textContent = (me.user.trim()[0] || '?').toUpperCase();
  const name = document.createElement('span'); name.textContent = me.user;
  const logout = document.createElement('a'); logout.href = '/auth/lark/logout'; logout.textContent = 'Đăng xuất';
  el.append(avatar, name, logout);
}

async function initIdentity() {
  try {
    const res = await fetch('/api/me', {headers: {'X-Dev-User': devUser}});
    if (res.ok) {
      const me = await res.json();
      isAuthenticated = true;
      devUser = me.user;
      renderAccount(me);
      const input = document.getElementById('message-input');
      input.disabled = false;
      input.placeholder = 'Mô tả báo cáo bạn muốn làm...';
      document.getElementById('send-btn').disabled = false;
      document.getElementById('admin-tab').hidden = !me.is_admin;
      return;
    }
  } catch (e) { /* rơi xuống nhánh chưa đăng nhập bên dưới */ }

  isAuthenticated = false;
  renderAccount(null);
}
initIdentity();

function setButtonBusy(btn, busyText) {
  if (btn.dataset.originalText === undefined) btn.dataset.originalText = btn.textContent;
  btn.disabled = true;
  btn.classList.add('is-busy');
  btn.textContent = busyText;
}
function clearButtonBusy(btn) {
  btn.disabled = false;
  btn.classList.remove('is-busy');
  if (btn.dataset.originalText !== undefined) btn.textContent = btn.dataset.originalText;
}

function showEmptyState(container, message) {
  container.innerHTML = '';
  const p = document.createElement('p');
  p.className = 'empty-state';
  p.textContent = message;
  container.appendChild(p);
}

const messagesEl = document.getElementById('messages');

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text; // untrusted content -> textContent, never innerHTML
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
addMessage('advisor', 'Chào bạn! Mô tả báo cáo bạn muốn làm, mình sẽ gợi ý bảng dữ liệu phù hợp.');

/* ---------- Advisor chat ---------- */
let advisorSessionId = null;

document.getElementById('send-btn').onclick = sendMessage;
document.getElementById('message-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendText(text);
}

async function sendText(text) {
  if (!isAuthenticated) {
    addMessage('refuse', 'Bạn cần đăng nhập Lark trước (link ở góc trên) mới chat được.');
    return;
  }
  addMessage('user', text);
  clearClarifyingOptions();

  const sendBtn = document.getElementById('send-btn');
  setButtonBusy(sendBtn, '...');
  const thinkingMsg = document.createElement('div');
  thinkingMsg.className = 'msg advisor';
  thinkingMsg.textContent = '💭 Đang tìm bảng phù hợp...';
  messagesEl.appendChild(thinkingMsg);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const resp = await apiFetch('/api/advise/message', {
      method: 'POST',
      body: JSON.stringify({session_id: advisorSessionId, message: text}),
    });
    advisorSessionId = resp.session_id;
    addMessage(resp.action === 'not_available' ? 'refuse' : 'advisor', resp.message_to_user);

    if (resp.action === 'clarify') {
      renderClarifyingOptions(resp.clarifying_options);
    } else {
      // 'recommend' và 'not_available' cùng lọc lại danh sách bảng bên phải —
      // applyAdvisorFilter() tự quyết định lọc theo gợi ý hay lọc rỗng (xem
      // định nghĩa hàm bên dưới, đây là nơi DUY NHẤT phân biệt 2 action này).
      applyAdvisorFilter(resp);
      resp.unsuitable.forEach(u => addUnsuitableNote(u));
    }
  } catch (e) {
    addMessage('refuse', 'Lỗi: ' + e.message);
  } finally {
    thinkingMsg.remove();
    clearButtonBusy(sendBtn);
  }
}

function addUnsuitableNote(u) {
  const note = document.createElement('div');
  note.className = 'unsuitable-card';
  note.textContent = `Không dùng ${u.table_id.split('.').pop()}: ${u.why_not}`;
  messagesEl.appendChild(note);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

const clarifyOptionsEl = document.createElement('div');
clarifyOptionsEl.id = 'clarify-options';
messagesEl.after(clarifyOptionsEl);

function clearClarifyingOptions() {
  clarifyOptionsEl.innerHTML = '';
}

function renderClarifyingOptions(groups) {
  clearClarifyingOptions();
  if (!groups || groups.length === 0) return;

  const selections = groups.map(() => new Set());

  groups.forEach((group, gi) => {
    const box = document.createElement('div');
    box.className = 'clarify-group';
    const q = document.createElement('div');
    q.className = 'clarify-question';
    q.textContent = group.question;
    box.appendChild(q);

    const opts = document.createElement('div');
    opts.className = 'clarify-pills';
    group.options.forEach((opt) => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'clarify-pill';
      pill.textContent = opt;
      pill.onclick = () => {
        if (group.allow_multiple) {
          if (selections[gi].has(opt)) { selections[gi].delete(opt); pill.classList.remove('selected'); }
          else { selections[gi].add(opt); pill.classList.add('selected'); }
        } else {
          selections[gi].clear();
          selections[gi].add(opt);
          opts.querySelectorAll('.clarify-pill').forEach(p => p.classList.remove('selected'));
          pill.classList.add('selected');
        }
      };
      opts.appendChild(pill);
    });
    box.appendChild(opts);
    clarifyOptionsEl.appendChild(box);
  });

  const extraRow = document.createElement('div');
  extraRow.className = 'clarify-extra-row';
  const extraInput = document.createElement('input');
  extraInput.placeholder = 'Gõ thêm nếu cần (không bắt buộc)...';
  const submitBtn = document.createElement('button');
  submitBtn.textContent = 'Gửi lựa chọn';
  submitBtn.onclick = () => {
    const parts = [];
    groups.forEach((group, gi) => {
      if (selections[gi].size > 0) parts.push(`${group.question} ${Array.from(selections[gi]).join(', ')}`);
    });
    const extra = extraInput.value.trim();
    if (extra) parts.push(extra);
    if (parts.length === 0) { alert('Chọn ít nhất 1 lựa chọn hoặc gõ thêm.'); return; }
    sendText(parts.join(' — '));
  };
  extraRow.appendChild(extraInput);
  extraRow.appendChild(submitBtn);
  clarifyOptionsEl.appendChild(extraRow);
}

function fmtRowCount(n) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('vi-VN') + ' dòng';
}
function fmtSize(bytes) {
  if (!bytes) return '—';
  const mb = bytes / (1024 * 1024);
  if (mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}

function buildTableRow(t) {
  const rec = recommendedById[t.table_id];
  const row = document.createElement('div');
  row.className = 'table-row' + (rec ? ' recommended' : '');

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.className = 'table-row-checkbox';
  checkbox.checked = selectedTableIds.has(t.table_id);
  checkbox.title = 'Chọn bảng này để tải kèm data preview';
  checkbox.onclick = (e) => { e.stopPropagation(); toggleTableSelection(t); };
  row.appendChild(checkbox);

  row.onclick = () => openTableDetail(t.table_id);

  const main = document.createElement('div');
  main.className = 'table-row-main';
  const nameLine = document.createElement('div');
  nameLine.className = 'table-row-name';
  nameLine.textContent = t.table_name;
  if (t.has_pii) {
    const badge = document.createElement('span');
    badge.className = 'pii-badge';
    badge.textContent = 'CÓ DỮ LIỆU NHẠY CẢM';
    nameLine.appendChild(badge);
  }
  main.appendChild(nameLine);
  const desc = document.createElement('div');
  desc.className = 'table-row-desc';
  desc.textContent = t.purpose || t.description || '(chưa có mô tả)';
  main.appendChild(desc);
  if (rec && rec.why) {
    const why = document.createElement('div');
    why.className = 'table-row-why';
    why.textContent = rec.why;
    main.appendChild(why);
  }
  if (rec && rec.caveats) {
    const caveat = document.createElement('div');
    caveat.className = 'table-row-caveat';
    caveat.textContent = '⚠️ ' + rec.caveats;
    main.appendChild(caveat);
  }
  row.appendChild(main);

  const stats = document.createElement('div');
  stats.className = 'table-row-stats';
  stats.textContent = fmtRowCount(t.row_count);
  row.appendChild(stats);

  return row;
}

function renderTableGroups(tables) {
  const byDataset = {};
  tables.forEach(t => { (byDataset[t.dataset] = byDataset[t.dataset] || []).push(t); });

  Object.keys(byDataset).sort().forEach(dataset => {
    const group = document.createElement('div');
    group.className = 'dataset-group';
    const h3 = document.createElement('h3');
    h3.textContent = DATASET_LABELS[dataset] || dataset;
    group.appendChild(h3);

    const list = document.createElement('div');
    list.className = 'table-list';
    byDataset[dataset].forEach(t => list.appendChild(buildTableRow(t)));
    group.appendChild(list);
    tableGroupsEl.appendChild(group);
  });
}

function renderCurrentSet() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const matches = (t) => !q || t.table_name.toLowerCase().includes(q)
    || (t.purpose || '').toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q);
  const base = allTables.filter(matches);

  tableGroupsEl.innerHTML = '';
  if (base.length === 0) {
    showEmptyState(tableGroupsEl, 'Không tìm thấy bảng nào khớp.');
    return;
  }

  const recommendedIds = Object.keys(recommendedById).sort((a, b) => recommendedById[a].rank - recommendedById[b].rank);
  const byId = {};
  base.forEach(t => { byId[t.table_id] = t; });
  const recommendedTables = recommendedIds.map(id => byId[id]).filter(Boolean);
  const otherTables = base.filter(t => !recommendedById[t.table_id]);

  if (recommendedTables.length > 0) {
    const title = document.createElement('div');
    title.className = 'recommended-section-title';
    title.textContent = `✨ Phù hợp với yêu cầu của bạn (${recommendedTables.length})`;
    tableGroupsEl.appendChild(title);
    const list = document.createElement('div');
    list.className = 'table-list';
    recommendedTables.forEach(t => list.appendChild(buildTableRow(t)));
    tableGroupsEl.appendChild(list);

    if (otherTables.length > 0) {
      const othersTitle = document.createElement('div');
      othersTitle.className = 'others-section-title';
      othersTitle.textContent = 'Bảng khác';
      tableGroupsEl.appendChild(othersTitle);
    }
  }
  renderTableGroups(otherTables);
}

document.getElementById('search-input').addEventListener('input', renderCurrentSet);

/* ---------- Advisor: bold + đẩy bảng phù hợp lên đầu (không ẩn bảng còn lại) ---------- */
function applyAdvisorFilter(resp) {
  document.getElementById('search-input').value = ''; // tránh kết hợp với tìm kiếm cũ gây khó hiểu

  if (resp.action === 'recommend') {
    recommendedById = {};
    resp.recommendations.forEach((rec, i) => {
      recommendedById[rec.table_id] = { why: rec.why, caveats: rec.caveats, rank: i };
    });
    explorerTitleEl.textContent = `Bảng dữ liệu Serving — ${resp.recommendations.length} bảng phù hợp`;
    filterReasonEl.textContent = resp.message_to_user;
    filterReasonEl.hidden = false;
  } else if (resp.action === 'not_available') {
    recommendedById = {};
    explorerTitleEl.textContent = 'Bảng dữ liệu Serving';
    filterReasonEl.textContent = resp.missing_data || resp.message_to_user;
    filterReasonEl.hidden = false;
  } else {
    return; // clarify: chưa đủ thông tin để gợi ý, giữ nguyên danh sách đang hiện
  }

  cancelFilterBtnEl.hidden = false;
  renderCurrentSet();
}

function clearAdvisorFilter() {
  recommendedById = {};
  cancelFilterBtnEl.hidden = true;
  filterReasonEl.hidden = true;
  explorerTitleEl.textContent = 'Bảng dữ liệu Serving';
  renderCurrentSet();
}

const DATA_QUERY_SPEC_CONTRACT = `--- Cấu trúc data_query_spec.json (BẮT BUỘC theo đúng, server validate chặt — sai cấu trúc sẽ bị từ chối lúc upload) ---
{
  "table_id": "<đúng y hệt table_id ghi ở mỗi bảng bên trên>",
  "columns": ["<cột dùng để nhóm/group by — để mảng rỗng [] nếu không cần nhóm>"],
  "aggregations": [
    {"column": "<tên cột số thật>", "fn": "SUM|COUNT|AVG|MIN|MAX", "alias": "<tên_kết_quả>"}
  ],
  "filters": [
    {"column": "<tên cột thật>", "op": "eq|ne|gt|gte|lt|lte", "value": <giá trị>, "type": "STRING|INT64|FLOAT64|BOOL|DATE|TIMESTAMP"}
  ],
  "order_by": [{"column": "<tên cột hoặc alias>", "direction": "asc|desc"}],
  "limit": 500
}
Quy tắc bắt buộc:
- table_id / columns / aggregations[].column / filters[].column: PHẢI là tên cột THẬT lấy đúng từ schema bên trên — không suy đoán, không tự đặt tên khác, không dịch sang tiếng Anh/Việt.
- aggregations[].fn chỉ nhận đúng 1 trong: SUM, COUNT, AVG, MIN, MAX. alias chỉ gồm chữ/số/gạch dưới, không bắt đầu bằng số, không trùng tên cột hay alias khác trong cùng spec.
- filters[].op chỉ nhận: eq, ne, gt, gte, lt, lte. filters[].type phải khớp đúng kiểu dữ liệu thật của cột đó (xem cột "Kiểu" trong schema).
- order_by[].column phải là 1 tên nằm trong "columns" hoặc là 1 alias trong "aggregations" — không sort được theo cột chưa chọn.
- Có cả columns và aggregations -> tự động GROUP BY theo columns. Chỉ có aggregations (columns rỗng) -> trả về đúng 1 dòng tổng hợp toàn bảng.
- KHÔNG hỗ trợ JOIN/subquery/SQL tự do — mỗi spec chỉ 1 bảng, 1 tầng aggregation.
- limit: số nguyên dương, tối đa 10000, mặc định 500 nếu bỏ trống.

--- Nếu cần dùng NHIỀU BẢNG trong 1 dashboard (tối đa 3 bảng) ---
Bọc các spec đơn ở trên vào 1 object "specs", mỗi key là 1 tên bạn tự đặt (chỉ chữ/số/gạch dưới, không bắt đầu bằng số — đây cũng là key mà fetch('data') sẽ trả về):
{
  "specs": {
    "ten_ban_tu_dat_1": { ...1 spec đơn như cấu trúc trên... },
    "ten_ban_tu_dat_2": { ...1 spec đơn như cấu trúc trên... }
  }
}`;

function buildAiExportText(tablesData) {
  const parts = [];
  parts.push('=== DỮ LIỆU MẪU CHO AI THIẾT KẾ DASHBOARD (Data Explorer — ai-dashboard-builder) ===\n');
  parts.push(
    'CẢNH BÁO QUAN TRỌNG — đọc trước khi làm gì khác:\n'
    + 'Mỗi bảng dưới đây chỉ có tối đa 50 DÒNG MẪU để bạn xem cấu trúc/định dạng dữ liệu.\n'
    + 'Bảng THẬT trong BigQuery có thể có hàng nghìn đến hàng triệu dòng, trải dài NHIỀU NĂM.\n'
    + 'TUYỆT ĐỐI KHÔNG hardcode bất kỳ giá trị cụ thể nào thấy trong mẫu (tên brand, mã kênh,\n'
    + 'ngày tháng, số lượng...) làm điều kiện lọc cứng trong dashboard.html hay trong\n'
    + 'data_query_spec.json — số liệu thật đa dạng và nhiều hơn rất nhiều so với mẫu này.\n'
    + '\n'
    + 'Dashboard bạn tạo ra KHÔNG hiển thị trực tiếp 50 dòng mẫu này. Khi người xem mở trang,\n'
    + "dashboard sẽ tự gọi fetch('data') để server truy vấn lại BigQuery THẬT theo đúng file\n"
    + 'data_query_spec.json bạn viết, trả JSON dạng {"columns": [...], "rows": [...]} (hoặc\n'
    + '{"tên_bảng": {"columns":..., "rows":...}, ...} nếu dùng nhiều bảng — xem contract bên dưới).\n'
  );

  tablesData.forEach(({ table, preview }, i) => {
    parts.push(`\n${'='.repeat(70)}\nBẢNG ${i + 1}/${tablesData.length}: ${table.table_name}\n${'='.repeat(70)}`);
    parts.push(`table_id: ${table.table_id}`);
    parts.push(`Số dòng thật trong bảng: ${fmtRowCount(table.row_count)}`);
    parts.push(`Mục đích / nội dung bảng: ${table.purpose || table.description || '(chưa có mô tả)'}`);
    if (table.grain) parts.push(`Grain (1 dòng nghĩa là gì): ${table.grain}`);
    if (table.has_pii) parts.push(`⚠️ Bảng có dữ liệu nhạy cảm: ${table.pii_note || ''}`);

    parts.push('\nSchema cột (tên - kiểu - mô tả):');
    (table.columns || []).forEach(c => {
      let line = `- ${c.name} (${c.type})`;
      if (c.friendly_name) line += ` — ${c.friendly_name}`;
      if (c.description) line += `: ${c.description}`;
      parts.push(line);
      (c.sentinel_values || []).forEach(s => {
        parts.push(`    ⚠️ Giá trị sentinel: ${s.value} = ${s.meaning} — KHÔNG tính vào tổng/trung bình, hiện riêng nếu cần.`);
      });
    });

    if (preview && preview.rows && preview.rows.length) {
      parts.push(`\n${preview.rows.length} dòng dữ liệu mẫu (CSV):`);
      const cols = preview.columns;
      const csvEscape = (v) => {
        if (v === null || v === undefined) return '';
        const s = String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      parts.push(cols.join(','));
      preview.rows.forEach(row => parts.push(cols.map(c => csvEscape(row[c])).join(',')));
    } else {
      parts.push('\n(Không lấy được dữ liệu mẫu — vẫn dùng đúng schema ở trên để viết dashboard.)');
    }
  });

  parts.push(`\n\n${'='.repeat(70)}\nHƯỚNG DẪN CHO AI — YÊU CẦU ĐẦU RA\n${'='.repeat(70)}`);
  parts.push(
    'Trả về đúng 2 file:\n'
    + '1. dashboard.html — file HTML đầy đủ (<!doctype html>...), tự vẽ KPI/biểu đồ/bảng,\n'
    + "   gọi fetch('data') lúc trang load để lấy số liệu thật (dùng đường dẫn TƯƠNG ĐỐI\n"
    + "   'data', không phải URL tuyệt đối — app tự chèn <base> đúng chỗ khi host).\n"
    + '2. data_query_spec.json — JSON mô tả câu truy vấn sẽ chạy MỖI LẦN có người mở dashboard,\n'
    + '   theo ĐÚNG cấu trúc bên dưới.\n'
  );
  parts.push(DATA_QUERY_SPEC_CONTRACT);
  parts.push(
    '\n--- Nộp bài / lấy link nhúng Lark ---\n'
    + '1. Vào https://ai-dashboard-builder-2eodhfgo5a-as.a.run.app/embeds.html (đăng nhập Lark trước,\n'
    + '   cần được cấp quyền upload — có nút "Yêu cầu cấp quyền" nếu chưa có).\n'
    + '2. Chọn chế độ "📁 Upload file HTML có sẵn" → nhập tên dashboard → chọn file dashboard.html.\n'
    + '3. Bật "Dữ liệu sống" → "🗄️ Bảng BigQuery" → "📝 Nhập JSON trực tiếp" → dán nguyên nội dung\n'
    + '   file data_query_spec.json vào ô đó.\n'
    + '4. Bấm Upload → nhận link /d/{id} → copy dán vào Lark.'
  );

  return parts.join('\n');
}

document.getElementById('export-selection-btn').onclick = async () => {
  const btn = document.getElementById('export-selection-btn');
  setButtonBusy(btn, '⏳ Đang chuẩn bị...');
  try {
    const ids = Array.from(selectedTableIds);
    const tablesData = await Promise.all(ids.map(async (id) => {
      const [table, preview] = await Promise.all([
        apiFetch(`/api/tables/${encodeURIComponent(id)}`),
        apiFetch(`/api/tables/${encodeURIComponent(id)}/preview?limit=50`).catch(() => null),
      ]);
      return { table, preview };
    }));
    const text = buildAiExportText(tablesData);
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `data-cho-ai-${new Date().toISOString().slice(0, 10)}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Lỗi chuẩn bị file: ' + e.message);
  } finally {
    clearButtonBusy(btn);
  }
};

function metaItem(label, value) {
  const item = document.createElement('div');
  item.className = 'detail-meta-item';
  const l = document.createElement('div'); l.className = 'detail-meta-label'; l.textContent = label;
  const v = document.createElement('div'); v.className = 'detail-meta-value'; v.textContent = value || '—';
  item.appendChild(l); item.appendChild(v);
  return item;
}

function renderTableDetail(table) {
  detailBodyEl.innerHTML = '';

  const title = document.createElement('h2');
  title.className = 'detail-title';
  title.textContent = table.table_name;
  detailBodyEl.appendChild(title);

  const datasetLine = document.createElement('p');
  datasetLine.className = 'detail-dataset';
  datasetLine.textContent = `${table.dataset} · ${table.table_type === 'VIEW' ? 'View' : 'Bảng'}`;
  detailBodyEl.appendChild(datasetLine);

  if (table.has_pii) {
    const banner = document.createElement('div');
    banner.className = 'pii-banner';
    banner.textContent = '⚠️ Bảng này có dữ liệu nhạy cảm: ' + table.pii_note;
    detailBodyEl.appendChild(banner);
  }

  if (table.grain) {
    const grainBox = document.createElement('div');
    grainBox.className = 'grain-callout';
    const icon = document.createElement('div'); icon.className = 'grain-callout-icon'; icon.textContent = '📐';
    const text = document.createElement('div');
    const label = document.createElement('div'); label.className = 'grain-callout-label'; label.textContent = 'Grain — 1 dòng nghĩa là gì';
    const value = document.createElement('div'); value.className = 'grain-callout-value'; value.textContent = table.grain;
    text.appendChild(label); text.appendChild(value);
    grainBox.appendChild(icon); grainBox.appendChild(text);
    detailBodyEl.appendChild(grainBox);
  }

  const metaGrid = document.createElement('div');
  metaGrid.className = 'detail-meta-grid';
  metaGrid.appendChild(metaItem('Mục đích', table.purpose || table.description));
  metaGrid.appendChild(metaItem('Tần suất cập nhật', table.refresh));
  metaGrid.appendChild(metaItem('Số dòng', fmtRowCount(table.row_count) + (table.size_bytes ? ` · ${fmtSize(table.size_bytes)}` : '')));
  metaGrid.appendChild(metaItem('Cập nhật lần cuối', table.last_modified_at ? new Date(table.last_modified_at).toLocaleString('vi-VN') : '—'));
  detailBodyEl.appendChild(metaGrid);

  if (table.kpi_names && table.kpi_names.length > 0) {
    const h4 = document.createElement('h4');
    h4.className = 'section-title';
    h4.textContent = 'Chỉ số liên quan';
    detailBodyEl.appendChild(h4);
    const row = document.createElement('div');
    row.className = 'kpi-chip-row';
    table.kpi_names.forEach(name => {
      const chip = document.createElement('span');
      chip.className = 'kpi-chip';
      chip.textContent = name;
      row.appendChild(chip);
    });
    detailBodyEl.appendChild(row);
  }

  const colsTitle = document.createElement('h4');
  colsTitle.className = 'section-title';
  colsTitle.textContent = `Cột (${table.columns.length})`;
  detailBodyEl.appendChild(colsTitle);

  const colsWrap = document.createElement('div');
  colsWrap.className = 'scroll-table';
  const colsTable = document.createElement('table');
  colsTable.className = 'data-table';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Tên cột</th><th>Tên thân thiện</th><th>Kiểu dữ liệu</th><th>Mô tả</th></tr>';
  colsTable.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.columns.forEach(c => {
    const tr = document.createElement('tr');
    const tdName = document.createElement('td'); tdName.textContent = c.name; tdName.style.fontFamily = "'DM Mono', ui-monospace, monospace";
    const tdFriendly = document.createElement('td'); tdFriendly.textContent = c.friendly_name || '—';
    const tdType = document.createElement('td'); tdType.textContent = c.type;
    const tdDesc = document.createElement('td');
    tdDesc.style.whiteSpace = 'normal'; tdDesc.style.minWidth = '260px';
    tdDesc.textContent = c.description || '—';
    if (c.sentinel_values && c.sentinel_values.length > 0) {
      c.sentinel_values.forEach(s => {
        const note = document.createElement('div');
        note.className = 'sentinel-note';
        note.textContent = `⚠️ Giá trị ${s.value} = ${s.meaning}`;
        tdDesc.appendChild(note);
      });
    }
    tr.appendChild(tdName); tr.appendChild(tdFriendly); tr.appendChild(tdType); tr.appendChild(tdDesc);
    tbody.appendChild(tr);
  });
  colsTable.appendChild(tbody);
  colsWrap.appendChild(colsTable);
  detailBodyEl.appendChild(colsWrap);

  const previewBtn = document.createElement('button');
  previewBtn.id = 'preview-btn';
  previewBtn.textContent = 'Xem 20 dòng dữ liệu';
  previewBtn.onclick = () => loadPreview(table.table_id, previewBtn);
  detailBodyEl.appendChild(previewBtn);

  const previewContainer = document.createElement('div');
  previewContainer.id = 'preview-container';
  detailBodyEl.appendChild(previewContainer);
}

async function loadPreview(tableId, btn) {
  const container = document.getElementById('preview-container');
  setButtonBusy(btn, '⏳ Đang tải...');
  try {
    const resp = await apiFetch(`/api/tables/${encodeURIComponent(tableId)}/preview?limit=20`);
    renderPreview(container, resp);
  } catch (e) {
    showEmptyState(container, 'Lỗi xem dữ liệu: ' + e.message);
  } finally {
    clearButtonBusy(btn);
  }
}

function renderPreview(container, resp) {
  container.innerHTML = '';

  if (resp.pii_warning) {
    const banner = document.createElement('div');
    banner.className = 'pii-banner';
    banner.style.marginTop = '14px';
    banner.textContent = '⚠️ Dữ liệu bên dưới có thông tin nhạy cảm: ' + resp.pii_warning;
    container.appendChild(banner);
  }

  const h4 = document.createElement('h4');
  h4.className = 'section-title';
  h4.textContent = `Xem trước ${resp.rows.length} dòng`;
  container.appendChild(h4);

  if (resp.ordering_note) {
    const note = document.createElement('p');
    note.className = 'ordering-note';
    note.textContent = resp.ordering_note;
    container.appendChild(note);
  }

  const columnNotes = resp.column_notes || {};
  // Cột nào có sentinel value thì dựng sẵn map value(string) -> ý nghĩa, để tra
  // nhanh theo từng ô khi render — tránh lặp lại việc tìm kiếm trong mảng mỗi ô.
  const sentinelByColumn = {};
  Object.keys(columnNotes).forEach(col => {
    const values = columnNotes[col].sentinel_values || [];
    if (values.length > 0) {
      sentinelByColumn[col] = {};
      values.forEach(s => { sentinelByColumn[col][s.value] = s.meaning; });
    }
  });

  const wrap = document.createElement('div');
  wrap.className = 'scroll-table';
  const table = document.createElement('table');
  table.className = 'data-table';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  resp.columns.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c;
    const note = columnNotes[c];
    if (note && (note.friendly_name || note.description)) {
      th.title = [note.friendly_name, note.description].filter(Boolean).join(' — ');
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  resp.rows.forEach(row => {
    const tr = document.createElement('tr');
    resp.columns.forEach(c => {
      const td = document.createElement('td');
      const v = row[c];
      const sentinelMeaning = sentinelByColumn[c] && v !== null && v !== undefined
        ? sentinelByColumn[c][String(v)] : undefined;
      if (v === null || v === undefined) { td.textContent = 'NULL'; td.className = 'null-cell'; }
      else if (sentinelMeaning) {
        td.textContent = `${v} ⚠️`;
        td.className = 'sentinel-cell';
        td.title = `${v} = ${sentinelMeaning} (không phải số liệu thật)`;
      }
      else if (typeof v === 'object') { td.textContent = JSON.stringify(v); }
      else { td.textContent = String(v); }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  container.appendChild(wrap);
}

loadTables();
</script>
